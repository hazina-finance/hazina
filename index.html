<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6B57">
<meta name="description" content="Hazina personal finance and budgeting app">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hazina">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Hazina Finance Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky ledger header with month switcher + tab rail; content in a 12-col grid that stacks to one column on phones; floating "Log" button. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E9EEEA; --ink:#13221C; --ink-2:#55665E; --line:#D6DED8;
  --accent:#0E6B57; --accent-ink:#FFFFFF; --accent-soft:#D9ECE5; --gold:#A86A0B; --gold-soft:#F6E8CF;
  --good:#1D8A4B; --warn:#DD7206; --bad:#C8383A; --shadow:0 1px 2px rgba(19,34,28,.06),0 4px 16px rgba(19,34,28,.06);
  --c1:#3657A6; --c2:#11806A; --c3:#B47A0E; --c4:#8A4FB0; --c5:#C24F6E; --c6:#4F7F1E;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#151F1B; --surface-2:#1C2924; --ink:#E4EDE8; --ink-2:#9BAEA6; --line:#283630;
  --accent:#3DBE9A; --accent-ink:#06211A; --accent-soft:#163A30; --gold:#E2B256; --gold-soft:#3A2E17;
  --good:#4CC47F; --warn:#F2A14C; --bad:#F07272; --shadow:none;
  --c1:#7D9BEA; --c2:#3DBE9A; --c3:#E2B256; --c4:#C08BE6; --c5:#EE8AA5; --c6:#9BCB62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#151F1B; --surface-2:#1C2924; --ink:#E4EDE8; --ink-2:#9BAEA6; --line:#283630;
  --accent:#3DBE9A; --accent-ink:#06211A; --accent-soft:#163A30; --gold:#E2B256; --gold-soft:#3A2E17;
  --good:#4CC47F; --warn:#F2A14C; --bad:#F07272; --shadow:none;
  --c1:#7D9BEA; --c2:#3DBE9A; --c3:#E2B256; --c4:#C08BE6; --c5:#EE8AA5; --c6:#9BCB62; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:700}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px}
.brand b{font-family:var(--f-display);font-size:1.15rem;display:block;line-height:1.1}
.brand small{color:var(--ink-2);font-size:.75rem}
.month{display:flex;align-items:center;background:var(--surface-2);border-radius:999px;padding:3px}
.month button{border:0;background:transparent;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--ink-2)}
.month button:hover{background:var(--surface)}
.month span{min-width:118px;text-align:center;font-weight:600;font-size:.92rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:38px;padding:0 14px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-weight:600;font-size:.86rem}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.sync{font-size:.75rem;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.sync.local i{background:var(--warn)} .sync.busy i{background:var(--gold)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:.9rem;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--accent);border-color:var(--accent)}
main{padding-block:20px 120px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);padding:10px 14px;border-radius:var(--r);margin-bottom:16px;font-size:.9rem}
.banner p{margin:0;flex:1 1 260px}
/* grid & cards */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
@media (max-width:900px){.s8,.s7,.s6,.s5,.s4{grid-column:span 12}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.muted{color:var(--ink-2)} .small{font-size:.82rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.pageh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pageh h1{font-size:clamp(1.4rem,3vw,1.9rem)}
.pageh p{margin:4px 0 0;color:var(--ink-2);max-width:62ch}
/* hero position */
.hero{background:var(--ink);color:var(--bg);border:0;padding:20px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:24px}
.hero .eyebrow{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.nw{font-family:var(--f-display);font-size:clamp(2rem,5vw,2.9rem);font-weight:700;line-height:1.05;margin:6px 0 10px;letter-spacing:-.02em}
.nwsplit{display:flex;gap:18px;flex-wrap:wrap;font-size:.88rem}
.nwsplit span{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:color-mix(in srgb,var(--bg) 8%,transparent);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:1.2rem;font-family:var(--f-display);margin-top:2px}
.kpi small{color:color-mix(in srgb,var(--bg) 65%,transparent);font-size:.75rem}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* privacy */
body.private .m{filter:blur(8px);user-select:none}
body.private input.m{filter:blur(6px)}
.m{transition:filter .2s}
/* progress */
.prog{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--good)}
.prog.warn i{background:var(--warn)} .prog.bad i{background:var(--bad)} .prog.acc i{background:var(--accent)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .prog{grid-column:1/-1}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pos{color:var(--good)} .neg{color:var(--bad)}
/* chambers */
.cham{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ch{border-radius:10px;padding:12px;background:var(--surface-2);border-top:4px solid var(--cc)}
.ch b{display:block;font-family:var(--f-display);font-size:1.15rem}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin:12px 0 6px}
.stack i{display:block;height:100%}
.total-line{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.total-line b{font-family:var(--f-display);font-size:1.3rem}
/* tables */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.sub td{background:var(--surface-2);font-weight:700;font-size:.82rem}
tr.tot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
td input,td select{width:100%;min-width:90px;border:1px solid transparent;background:transparent;border-radius:7px;padding:6px 7px}
td input:hover,td select:hover{border-color:var(--line)}
td input:focus,td select:focus{border-color:var(--accent);background:var(--surface);outline:none}
td input[type=number],td input.numin{text-align:right}
td.pctin input{min-width:70px;max-width:96px;margin-left:auto}
td input.wide{min-width:180px}
.x{border:0;background:transparent;color:var(--ink-2);cursor:pointer;border-radius:6px;width:30px;height:30px;font-size:16px}
.x:hover{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.addrow{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--accent);font-weight:600;font-size:.85rem;margin-top:8px}
.addrow:hover{border-color:var(--accent)}
/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.78rem;font-weight:600;color:var(--ink-2)}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 11px;min-height:44px;width:100%}
.field input:focus,.field select:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn:focus-visible,.iconbtn:focus-visible,a:focus-visible,.x:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:9px 4px;font-weight:600;cursor:pointer;font-size:.88rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.linked{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.linked .swap{padding-bottom:12px;color:var(--ink-2)}
/* rule block */
.rule{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rule .r{border-radius:10px;padding:14px;background:var(--surface-2)}
.rule .r .big{font-family:var(--f-display);font-size:1.8rem;font-weight:700;line-height:1}
@media (max-width:640px){.rule{grid-template-columns:1fr}}
.split{display:flex;height:28px;border-radius:8px;overflow:hidden;margin:8px 0;font-size:.75rem;font-weight:700}
.split i{display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--lc);margin-right:6px;vertical-align:-1px}
/* tx list */
.txday{font-size:.75rem;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;padding:12px 0 4px}
.tx{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.tx .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:.8rem;background:var(--surface-2)}
.tx .ic.income{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.tx .ic.save{background:var(--gold-soft);color:var(--gold)}
.tx .ic.withdraw{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tx .t{min-width:0}.tx .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t small{color:var(--ink-2)}
.tx .amt{font-weight:700;text-align:right}
.tx .acts{display:flex}
.empty{padding:24px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:10px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;min-height:38px}
.filters input{flex:1 1 160px;min-width:0}
/* insights */
.ins{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.ins:last-child{border-bottom:0}
.rank{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.78rem;flex:none}
.ins .t{flex:1;min-width:0}
.feature{background:var(--accent-soft);border-radius:10px;padding:14px;margin-bottom:10px}
.feature b.big{font-family:var(--f-display);font-size:1.6rem;display:block}
svg text{fill:var(--ink-2);font-size:11px;font-family:var(--f-body)}
.chart{width:100%;height:auto;display:block}
/* FAB + modal */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;height:56px;padding:0 22px 0 18px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.25)}
.fab span{font-size:26px;line-height:1;margin-top:-2px}
.scrim{position:fixed;inset:0;background:rgba(8,14,12,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.scrim{align-items:center}}
.modal{background:var(--surface);width:min(520px,100%);border-radius:18px 18px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.modal{border-radius:18px}}
.modal .amt-in input{font-size:1.8rem;font-family:var(--f-display);font-weight:700;padding:10px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px)}
.note{font-size:.82rem;color:var(--ink-2);margin:8px 0 0}
.tip{background:var(--surface-2);border-radius:10px;padding:12px;font-size:.86rem}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.kv b{font-weight:700}
.inline-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* update banner */
.updbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:80;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.updbar .btn{background:var(--accent-ink);color:var(--accent)}
/* lending */
.segtype{grid-template-columns:repeat(5,1fr)!important}
.seg2{grid-template-columns:1fr 1fr}
.lendrow{padding:12px 0;border-bottom:1px solid var(--line)}.lendrow:last-child{border-bottom:0}
.tx .ic.lend{background:color-mix(in srgb,var(--c4) 16%,transparent);color:var(--c4)}
.tx .ic.repay{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
details summary{cursor:pointer;color:var(--accent);font-weight:600}
/* fees */
.feebox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:end}
.feetot{background:var(--surface-2);border-radius:9px;padding:10px 12px;min-height:44px;align-items:center}
@media (max-width:480px){.feebox{grid-template-columns:1fr}}
/* planner groups */
.chips{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.chip{border:1px solid var(--line);border-left:4px solid var(--band,var(--line));background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.chip b{font-size:.9rem}.chip small{font-size:.75rem;color:var(--ink-2)}
.chip:hover{border-color:var(--accent)}
.chip[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.chip[aria-selected="true"] small{color:inherit;opacity:.85}
.chip.add{border-style:dashed;border-left-width:1px;color:var(--accent)}
.chip.newg{flex-direction:row;align-items:center;gap:6px;border-left-width:1px;cursor:default}
.chip.newg input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;width:170px;background:var(--surface)}
.chip.newg .btn{min-height:36px;padding:6px 12px}
@media (max-width:640px){.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.chip{flex:none}}
.grphead{display:flex;flex-direction:column;gap:2px;min-width:0}
.grpwrap{display:inline-flex;align-items:center;gap:4px;max-width:100%}
.grpwrap .pen{color:var(--ink-2);font-size:.9rem}
.chip.newg select{border:1px solid var(--line);border-radius:8px;padding:7px 6px;background:var(--surface)}
.grpname{font-family:var(--f-display);font-weight:700;font-size:1.05rem;border:1px solid transparent;border-radius:8px;padding:4px 6px;margin-left:-6px;background:transparent;min-width:0;max-width:100%}
.grpname:hover{border-color:var(--line)}.grpname:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem}
.btn.danger-t{color:var(--bad)}
/* faster editing */
.selbox,.selall{width:20px;height:20px;accent-color:var(--bad);cursor:pointer;margin:0 6px}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.22);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px)}
.selbar .btn{min-height:40px;padding:8px 14px}
body:has(.selbar) .fab{display:none}
body:has(.selbar) .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.toast{display:flex;gap:14px;align-items:center}

<script>
(()=>{
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:0};
const fmt=n=>(n<0?'−':'')+'Ksh '+Math.round(Math.abs(n)).toLocaleString('en-KE');
const fmtIn=v=>{if(v===''||v==null)return '';const n=num(v);return n?n.toLocaleString('en-KE',{maximumFractionDigits:2}):''};
function liveFmt(el){
  const v=el.value,caret=el.selectionStart==null?v.length:el.selectionStart;
  const before=v.slice(0,caret).replace(/[^0-9.]/g,'').length;
  const clean=v.replace(/[^0-9.]/g,''),parts=clean.split('.');
  const int=parts[0].replace(/^0+(?=\d)/,''),dec=parts.length>1?'.'+parts.slice(1).join('').slice(0,2):'';
  const out=(int?Number(int).toLocaleString('en-KE'):(dec?'0':''))+dec;
  if(out===v)return;el.value=out;let n=0,pos=0;while(pos<out.length&&n<before){if(/[0-9.]/.test(out[pos]))n++;pos++}
  try{el.setSelectionRange(pos,pos)}catch(e){}
}
document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('numin'))liveFmt(e.target)},true);
const fmtS=n=>{const a=Math.abs(n);const s=a>=1e6?(a/1e6).toFixed(a>=1e7?0:1)+'M':a>=1e3?(a/1e3).toFixed(a>=1e5?0:1)+'k':Math.round(a)+'';return (n<0?'−':'')+s};
const M=(n,cls='')=>`<span class="m ${cls}">${fmt(n)}</span>`;
const pct=(a,b)=>b?a/b*100:0;
const nid=()=>Math.random().toString(36).slice(2,9);
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+f(x),0);
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const curMK=()=>todayStr().slice(0,7);
const addM=(mk,k)=>{let [y,m]=mk.split('-').map(Number);m+=k;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+pad(m)};
const mLabel=(mk,short)=>{const [y,m]=mk.split('-').map(Number);return new Date(y,m-1,1).toLocaleString('en-GB',short?{month:'short'}:{month:'long',year:'numeric'})};
const daysIn=mk=>{const [y,m]=mk.split('-').map(Number);return new Date(y,m,0).getDate()};
const monthsUntil=target=>{if(!target)return 1;const [y,m]=curMK().split('-').map(Number);const [ty,tm]=target.split('-').map(Number);return Math.max(1,(ty-y)*12+(tm-m)+1)};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const SUBS=['Home & Childcare','Personal','Transport','Family Support','Self-care & Grooming'];

/* ---------- default + example data ---------- */
function baseProfile(example){
  const c=(name,sub,budget)=>({id:nid(),name,group:sub==='WANTS'?'wants':'needs',sub:sub==='WANTS'?'Wants':sub,budget:example?budget:0});
  const now=curMK();
  return {v:1,example:!!example,
    settings:{gross:example?150000:0,netPct:72,netFixed:null,rule:{needs:50,save:30,wants:20},warnAt:80,availOpening:example?5000:0},
    sources:DEFAULT_SOURCES.map(s=>({...s})),shopLink:null,
    income:{grants:0,business:example?25000:0,infotrack:example?12000:0,ownmpesa:0,others:0},
    chambers:[
      {id:'ncba',name:'NCBA',opening:example?85000:0,mode:'pct',pct:10,amt:0,color:1},
      {id:'mshwari',name:'M-Shwari',opening:example?32000:0,mode:'amt',pct:0,amt:example?8000:0,color:2},
      {id:'mpesab',name:'M-PESA Business',opening:example?18500:0,mode:'amt',pct:0,amt:example?5000:0,color:3}],
    cats:[
      c('Rent','Home & Childcare',18000),c('Food & House Shopping','Home & Childcare',12000),c('Electricity','Home & Childcare',2500),c('Water','Home & Childcare',1200),
      c('Internet','Home & Childcare',3000),c('TV Subscriptions','Home & Childcare',1500),c('Nanny / Cleaning','Home & Childcare',6000),c('School Fees','Home & Childcare',0),c('Snacks','Home & Childcare',1500),
      c('Tithe & Offerings','Personal',5000),c('Personal Development','Personal',2000),c('Transaction Charges','Personal',800),c('Airtime & Bundles','Personal',2000),c('Online Subscriptions','Personal',1000),
      c('Public Transport','Transport',3000),c('Fuel','Transport',6000),c('Car Wash','Transport',800),c('Parking','Transport',1000),c('Car Service & Maintenance','Transport',2000),
      c('Parents Allowance','Family Support',5000),c('Siblings Allowance','Family Support',2000),
      c('Hair','Self-care & Grooming',1500),c('Wardrobe','Self-care & Grooming',3000),c('Health Costs','Self-care & Grooming',2000),
      c('Eating Out & Entertainment','WANTS',5000),c('Random Shopping','WANTS',3000),c('Outdoor Activities','WANTS',2000),c('Special Days & Gifts','WANTS',2000),c('Social Giving','WANTS',2000),c('Miscellaneous','WANTS',1500)],
    debts:example?[
      {id:'d1',name:'M-Shwari Loan',owed:15000,monthly:5000,rate:7.5,note:'30-day facility'},
      {id:'d2',name:'Sacco Loan',owed:250000,monthly:12000,rate:11,note:''}]:[],
    projects:example?[{id:'p1',name:'Kitchen shelving',month:now,budget:25000},{id:'p2',name:'Laptop repair',month:addM(now,1),budget:8000}]:[],
    sinking:example?[
      {id:nid(),name:'Car Service',amount:36000,target:addM(now,11),saved:6000},
      {id:nid(),name:'Own Birthday',amount:14000,target:addM(now,6),saved:2000},
      {id:nid(),name:'Home Improvements',amount:60000,target:addM(now,11),saved:10000},
      {id:nid(),name:'Medical Insurance',amount:45000,target:addM(now,8),saved:15000},
      {id:nid(),name:'Travel',amount:80000,target:addM(now,7),saved:12000},
      {id:nid(),name:'Christmas Spending',amount:30000,target:addM(now,1),saved:18000}]:[],
    goals:example?[
      {id:nid(),term:'medium',name:'Emergency Fund (6 months)',amount:500000,target:addM(now,23),saved:60000,avenue:'CIC MMF'},
      {id:nid(),term:'medium',name:'Mutual Fund Investments',amount:300000,target:addM(now,47),saved:45000,avenue:'Stanchart Mutual Funds'},
      {id:nid(),term:'medium',name:'Bond',amount:200000,target:addM(now,35),saved:50000,avenue:'Dhow CSD'},
      {id:nid(),term:'long',name:'Home Ownership',amount:3000000,target:addM(now,83),saved:150000,avenue:'Stima Sacco Savings'},
      {id:nid(),term:'long',name:'Relocate to Europe',amount:2000000,target:addM(now,119),saved:0,avenue:'Special Fund Investment'}]:[],
    assets:example?[
      {id:nid(),name:'Mutual Funds',amount:120000,purpose:'Growth'},
      {id:nid(),name:'Emergency Fund – MMF',amount:60000,purpose:'Emergencies'},
      {id:nid(),name:'Shares (current valuation)',amount:45000,purpose:'Long-term'},
      {id:nid(),name:'Land / House (present value)',amount:1500000,purpose:'Home'},
      {id:nid(),name:'Bonds',amount:50000,purpose:'Income'}]:[],
    shop:[['Maize flour',6,'kg',265,135],['Wheat flour',2,'kg',175,''],['Rice',5,'kg',180,''],['Tomato Sauce',1,'kg',195,''],['Cocoa',1,'pc',285,''],['Blue Band',1,'pc',300,''],['Sugar',4,'kg',170,''],['Bar soap',3,'pcs',180,''],['Milk box',1,'box',990,1000],['Cubes',1,'pcs',180,200],['Royco',1,'pc',100,''],['Eggs tray',1,'tray',450,420],['Salt',1,'kg',50,45],['Tissues',1,'pack',180,200],['Diapers',3,'pcs',480,500]].map(r=>({id:nid(),item:r[0],qty:r[1],unit:r[2],p1:r[3],p2:r[4]}))
  };
}
function exampleTx(P){
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
  const out={};const today=todayStr();
  const once=['Rent','Electricity','Water','Internet','TV Subscriptions','Nanny / Cleaning','Tithe & Offerings','Online Subscriptions','Parents Allowance','Siblings Allowance','Personal Development','Car Service & Maintenance'];
  for(let k=-2;k<=0;k++){
    const mk=addM(curMK(),k),dim=daysIn(mk),items=[];
    const add=(day,type,o)=>{const date=mk+'-'+pad(Math.min(day,dim));if(date<=today)items.push({id:nid(),date,type,desc:'',...o})};
    add(1,'income',{src:'salary',amt:108000,desc:'Salary',saves:{ncba:14300,mshwari:5000}});
    add(10,'income',{src:'infotrack',amt:12000,desc:'Infotrack payment',saves:{mshwari:3000,mpesab:2000}});
    add(12,'income',{src:'business',amt:11000+Math.round(rnd()*6)*1000,desc:'Shop sales',saves:{mpesab:3000}});
    add(24,'income',{src:'business',amt:10000+Math.round(rnd()*6)*1000,desc:'Shop sales'});
    P.debts.forEach(d=>add(5,'expense',{cat:'debt:'+d.id,amt:d.monthly,desc:'Instalment'}));
    if(k===0)add(2,'expense',{cat:'proj:p1',amt:9500,desc:'Timber & brackets'});
    if(k===-1)add(18,'withdraw',{ch:'mshwari',amt:6000,desc:'Car repair top-up'});
    if(k===-2)add(27,'expense',{cat:P.cats[0].id,amt:4000,desc:'Rent balance',ch:'ncba',chAmt:4000});
    P.cats.filter(c=>c.budget>0).forEach(c=>{
      const target=c.budget*(0.75+rnd()*0.4);
      if(once.includes(c.name)){add(1+Math.floor(rnd()*5),'expense',{cat:c.id,amt:Math.round(c.budget/50)*50});return}
      const n=3+Math.floor(rnd()*6);
      for(let i=0;i<n;i++)add(1+Math.floor(rnd()*dim),'expense',{cat:c.id,amt:Math.max(50,Math.round(target/n/10)*10),desc:''});
    });
    out[mk]=items;
  }
  return out;
}

/* ---------- state ---------- */
let P=null, TX={};
const ui={month:curMK(),view:'dashboard',priv:lsGet('hz-priv')==='1',txFilter:{type:'',cat:'',q:''},planGroup:lsGet('hz-pg')||'all',rep:{type:'expense',preset:'month',cat:'',ch:'',src:'',item:'',from:'',to:''},common:'count',confirm:null};

/* ---------- persistence (Supabase) ---------- */
const APP_VERSION='1.2';
const APP_BUILD='5 Nov 2026 · lending & fees';
const CFG=Object.assign({},window.HZ_CONFIG||{});try{CFG.supabaseUrl=new URL(String(CFG.supabaseUrl).trim()).origin}catch(e){}CFG.supabaseAnonKey=String(CFG.supabaseAnonKey||'').trim();
const configured=!!(window.supabase&&CFG.supabaseUrl&&CFG.supabaseAnonKey&&!/YOUR-/.test(CFG.supabaseUrl+CFG.supabaseAnonKey));
const sb=configured?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey):null;
const store={uid:null,me:null,pending:new Set(),flushing:false,retry:null};
const parse=s=>{try{return s?JSON.parse(s):null}catch(e){return null}};
const isAdmin=()=>!!(store.me&&store.me.role==='admin'&&store.me.active);
function setSync(cls,txt){const el=$('#sync');el.className='sync '+cls;el.querySelector('span').textContent=txt;el.title=txt}
const cacheKey=()=>'hz-cache-'+store.uid, pendKey=()=>'hz-pend-'+store.uid;
function cacheSave(){if(!store.uid||!P||store.viewing)return;lsSet(cacheKey(),JSON.stringify({P,TX}));lsSet(pendKey(),JSON.stringify([...store.pending]))}
const cacheSoon=debounce(cacheSave,300);
async function loadData(){
  if(store.viewing)return loadViewed();
  let ok=false;const cached=parse(lsGet(cacheKey())),pend=parse(lsGet(pendKey()))||[];
  try{
    const {data,error}=await sb.from('hz_docs').select('doc_id,body').eq('user_id',store.uid);
    if(error)throw error;
    let prof=null;const tx={};
    data.forEach(r=>{if(r.doc_id==='profile')prof=r.body;else if(r.doc_id.startsWith('tx-'))tx[r.doc_id.slice(3)]=(r.body&&r.body.items)||[]});
    P=migrate(prof);TX=tx;ok=true;
  }catch(e){if(cached){P=migrate(cached.P);TX=cached.TX||{}}}
  // put back changes made on this device that had not reached the server yet
  if(cached&&pend.length){pend.forEach(id=>{store.pending.add(id);if(id==='profile'){if(cached.P)P=migrate(cached.P)}else TX[id.slice(3)]=(cached.TX||{})[id.slice(3)]||[]})}
  if(!P){P=baseProfile(true);TX=exampleTx(P);store.fresh=true}
  setSync(ok?'':'local',ok?'Saved to your account':'Offline – changes will sync');
  render();if(store.pending.size)flush();
}
function queue(id){if(store.viewing){toast('Read-only: you are viewing another account');return}if(store.fresh){store.fresh=false;store.pending.add('profile');Object.keys(TX).forEach(mk=>store.pending.add('tx-'+mk))}store.pending.add(id);cacheSoon();setSync('busy','Saving…');flushSoon()}
const flushSoon=debounce(()=>flush(),700);
/* ---------- administrator incognito view (read-only) ---------- */
async function loadViewed(){
  const v=store.viewing;P=null;TX={};
  const {data,error}=await sb.from('hz_docs').select('doc_id,body').eq('user_id',v.id);
  if(error){toast('Could not open that account');store.viewing=null;return loadData()}
  const tx={};let prof=null;
  data.forEach(r=>{if(r.doc_id==='profile')prof=r.body;else if(r.doc_id.startsWith('tx-'))tx[r.doc_id.slice(3)]=(r.body&&r.body.items)||[]});
  v.empty=!prof;P=migrate(prof||baseProfile(false));TX=tx;
  setSync('busy','Incognito view');document.body.classList.add('viewing');render();window.scrollTo(0,0);
}
async function viewAs(id,name){
  if(store.pending.size){await flush();if(store.pending.size){toast('Your own changes haven’t synced yet. Connect to the internet first.');return}}
  store.viewing={id,name};ui.view='dashboard';ui.confirm=null;
  if(location.hash!=='#dashboard')history.replaceState(null,'','#dashboard');
  $('#app').innerHTML='<div class="empty">Opening '+esc(name)+'’s finances…</div>';await loadViewed();
}
async function exitView(){
  store.viewing=null;document.body.classList.remove('viewing');ui.view='users';ui.users=null;
  history.replaceState(null,'','#users');P=null;TX={};await loadData();
}
async function flush(){
  if(store.flushing||!store.uid||!sb)return;store.flushing=true;clearTimeout(store.retry);
  let failed=false;
  while(store.pending.size){
    const id=[...store.pending][0];store.pending.delete(id);
    const body=id==='profile'?P:{items:TX[id.slice(3)]||[]};
    const {error}=await sb.from('hz_docs').upsert({user_id:store.uid,doc_id:id,body,updated_at:new Date().toISOString()});
    if(error){store.pending.add(id);failed=true;break}
  }
  store.flushing=false;cacheSave();
  if(failed){setSync('local',navigator.onLine?'Not saved yet – retrying':'Offline – changes will sync');store.retry=setTimeout(flush,15000)}
  else setSync('','Saved to your account');
}
window.addEventListener('online',()=>flush());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&store.uid&&!store.viewing&&!store.pending.size&&!store.flushing&&!document.querySelector('.modal')&&!(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName)))loadData()});
const saveP=()=>queue('profile');
const saveTx=mk=>queue('tx-'+mk);

/* ---------- sign-in & account ---------- */
async function boot(){
  if(!sb){$('#app').innerHTML=`<div class="card"><h2>Almost there</h2><p>Open <b>config.js</b> and paste your Supabase project URL and anon key, then upload it again.</p></div>`;setSync('local','Not connected');$('#fab').hidden=true;return}
  let session=null;try{session=(await sb.auth.getSession()).data.session}catch(e){}
  if(session)await afterLogin(session.user);else showLogin();
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')showLogin()});
}
async function afterLogin(u){
  store.uid=u.id;let prof=null;
  try{const {data,error}=await sb.from('hz_profiles').select('*').eq('id',u.id).maybeSingle();if(error)throw error;prof=data;if(prof)lsSet('hz-me-'+u.id,JSON.stringify(prof))}
  catch(e){prof=parse(lsGet('hz-me-'+u.id))}
  if(!prof||!prof.active){await sb.auth.signOut().catch(()=>{});showLogin('Your account is not active yet. Ask your administrator to activate it.');return}
  store.me=prof;$('#auth').hidden=true;$('#fab').hidden=false;
  $('#acctName').textContent=prof.full_name||prof.email;$('#acct').hidden=false;
  const h=location.hash.slice(1);ui.view=views().some(v=>v[0]===h)?h:'dashboard';
  await loadData();
}
function showLogin(msg){
  P=null;TX={};store.uid=null;store.me=null;store.fresh=false;store.viewing=null;document.body.classList.remove('viewing');store.pending.clear();ui.users=null;
  $('#acct').hidden=true;$('#fab').hidden=true;$('#app').innerHTML='';$('#modalRoot').innerHTML='';$('#tabs').innerHTML='';
  $('#auth').hidden=false;const m=$('#authMsg');m.textContent=msg||'';m.hidden=!msg;setSync('local','Signed out');
}
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();const email=$('#liEmail').value.trim(),password=$('#liPw').value,btn=$('#liBtn'),m=$('#authMsg');
  if(!email||!password){m.textContent='Enter your email and password.';m.hidden=false;return}
  btn.disabled=true;btn.textContent='Signing in…';m.hidden=true;
  try{const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error)throw error;$('#liPw').value='';await afterLogin(data.user)}
  catch(err){const em=String((err&&err.message)||err||'');
    m.textContent=!navigator.onLine?'You are offline. Connect to the internet to sign in.'
      :/invalid login credentials/i.test(em)?'Email or password is incorrect.'
      :/confirm/i.test(em)?'This account’s email is not confirmed. In Supabase, open Authentication → Users and confirm it, or ask your administrator.'
      :/api key|apikey|jwt|unauthorized|401/i.test(em)?'Setup problem: the anon key in config.js is not accepted by Supabase. Copy the anon public key again (Project Settings → API Keys → Legacy API Keys).'
      :/fetch|network|load failed|name not resolved/i.test(em)?'Setup problem: the app cannot reach Supabase. Check the Project URL in config.js (it should look like https://abcd.supabase.co).'
      :'Sign-in failed: '+em;
    m.hidden=false;console.error('Sign-in error',err)}
  btn.disabled=false;btn.textContent='Sign in';
});
async function signOut(){
  if(store.pending.size){await flush();if(store.pending.size){toast('Some changes have not synced yet. Connect to the internet first.');return}}
  try{localStorage.removeItem(cacheKey());localStorage.removeItem(pendKey())}catch(e){}
  await sb.auth.signOut().catch(()=>{});showLogin();
}
function openAccount(){
  const me=store.me||{};
  $('#modalRoot').innerHTML=`<div class="scrim" id="scrim"><form class="modal" id="pwForm" role="dialog" aria-modal="true" aria-labelledby="acTitle">
    <div class="card-h" style="margin:0"><h2 id="acTitle">${esc(me.full_name||'My account')}</h2><button type="button" class="x" id="acClose" aria-label="Close">×</button></div>
    <div class="small muted">${esc(me.email||'')} · ${me.role==='admin'?'Administrator':'User'} · Hazina ${APP_VERSION}</div>
    <div class="eyebrow" style="margin-top:6px">Change password</div>
    <div class="field"><label for="pw1">New password (at least 8 characters)</label><input id="pw1" type="password" autocomplete="new-password" minlength="8"></div>
    <div class="field"><label for="pw2">Repeat new password</label><input id="pw2" type="password" autocomplete="new-password"></div>
    <div class="inline-actions"><button class="btn" type="submit">Change password</button><button class="btn ghost" type="button" id="acOut">Sign out</button></div>
  </form></div>`;
  const close=()=>{$('#modalRoot').innerHTML=''};
  $('#scrim').onclick=e=>{if(e.target.id==='scrim')close()};$('#acClose').onclick=close;$('#acOut').onclick=()=>{close();signOut()};
  $('#pwForm').onsubmit=async e=>{e.preventDefault();const a=$('#pw1').value,b=$('#pw2').value;
    if(a.length<8){toast('Use at least 8 characters');return}if(a!==b){toast('The two passwords don’t match');return}
    const {error}=await sb.auth.updateUser({password:a});if(error){toast('Could not change password: '+error.message);return}close();toast('Password changed')};
}
$('#acct').onclick=openAccount;

/* ---------- calculations ---------- */
const DEFAULT_SOURCES=[{id:'salary',name:'Net Salary'},{id:'grants',name:'Donor Grants'},{id:'business',name:'Business Income'},{id:'infotrack',name:'Infotrack'},{id:'ownmpesa',name:'Own M-Pesa'},{id:'others',name:'Others'}];
function migrate(p){
  if(!p)return p;
  p.settings=p.settings||{};p.income=p.income||{};
  if(!Array.isArray(p.sources))p.sources=DEFAULT_SOURCES.map(s=>({...s}));
  if('mshwari' in p.income){if(num(p.income.mshwari))p.income.others=num(p.income.others)+num(p.income.mshwari);delete p.income.mshwari}
  if(p.settings.availOpening==null)p.settings.availOpening=0;
  if(p.shopLink===undefined)p.shopLink=null;
  if(!Array.isArray(p.borrowers))p.borrowers=[];
  return p;
}
const srcName=id=>{const s=(P.sources||[]).find(x=>x.id===id);return s?s.name:id==='mshwari'?'M-Shwari':id==='avail'?'Available (saved later)':'Other income'};
const chName=id=>{const c=P.chambers.find(x=>x.id===id);return c?c.name:'Removed account'};
const netSalary=()=>P.settings.netFixed!=null&&!P.settings.gross?num(P.settings.netFixed):num(P.settings.gross)*num(P.settings.netPct)/100;
const planSrc=s=>s==='salary'?netSalary():num(P.income[s]);
const planIncome=()=>sum(P.sources,s=>planSrc(s.id));
const chTarget=c=>c.mode==='pct'?num(c.pct)/100*planIncome():num(c.amt);
const chPct=c=>c.mode==='pct'?num(c.pct):pct(num(c.amt),planIncome());
const allTx=()=>Object.values(TX).flat();
const txOf=mk=>TX[mk]||[];
const monthEnd=mk=>mk+'-'+pad(daysIn(mk));
/* what one entry does to Available to spend and to each savings account */
const xTot=t=>num(t.amt)+num(t.fee);
const feeCatId=()=>{const c=P.cats.find(c=>/transaction charge/i.test(c.name))||P.cats.find(c=>/(bank|m-?pesa|withdraw\w*|transfer) (charges?|fees?)/i.test(c.name));return c?c.id:''};
const feeOf=t=>num(t.fee);
function fx(t){
  const v=t.type==='expense'?xTot(t):num(t.amt),f=feeOf(t),o={avail:0,ch:{}};const add=(id,x)=>{if(id)o.ch[id]=(o.ch[id]||0)+x};
  if(t.type==='income'){let s=0;const sv=t.saves||{};for(const k in sv){const x=num(sv[k]);if(x>0){add(k,x);s+=x}}o.avail=v-s}
  else if(t.type==='save'){add(t.ch,v);o.avail=-v}
  else if(t.type==='expense'){const c=t.ch?Math.min(v,num(t.chAmt)):0;if(c>0)add(t.ch,-c);o.avail=-(v-c)}
  else if(t.type==='withdraw'){add(t.ch,-(v+f));o.avail=v}
  else if(t.type==='lend'){if(t.ch)add(t.ch,-(v+f));else o.avail=-(v+f)}
  else if(t.type==='repay'){if(t.ch)add(t.ch,v-f);else o.avail=v-f}
  else if(t.type==='transfer'){add(t.ch,-(v+f));add(t.to,v)}
  return o;
}
let _bal={};
function bal(upto){
  const k=upto||'all';if(_bal[k])return _bal[k];
  const b={avail:num(P.settings.availOpening),ch:{}};P.chambers.forEach(c=>b.ch[c.id]=num(c.opening));
  for(const t of allTx()){if(upto&&t.date>upto)continue;const e=fx(t);b.avail+=e.avail;for(const id in e.ch)b.ch[id]=(b.ch[id]||0)+e.ch[id]}
  b.total=sum(P.chambers,c=>b.ch[c.id]||0);return _bal[k]=b;
}
const chBalance=(c,upto)=>bal(upto).ch[c.id]||0;
const debtPays=d=>allTx().filter(t=>t.type==='expense'&&t.cat==='debt:'+d.id);
const debtPaid=d=>sum(debtPays(d),t=>num(t.amt));
const debtLeft=d=>Math.max(0,num(d.owed)-debtPaid(d));
const projSpent=p=>sum(allTx().filter(t=>t.type==='expense'&&t.cat==='proj:'+p.id),xTot);
function catInfo(id){
  if(!id)return{name:'Other',group:'wants',sub:'Other'};
  if(id.startsWith('debt:')){const d=P.debts.find(x=>'debt:'+x.id===id);return{name:d?d.name:'Old debt',group:'debt',sub:'Loans & instalments',budget:d?num(d.monthly):0}}
  if(id.startsWith('proj:')){const p=P.projects.find(x=>'proj:'+x.id===id);return{name:p?p.name:'Old project',group:'proj',sub:'Projects',budget:p?num(p.budget):0}}
  const c=P.cats.find(x=>x.id===id);return c?{name:c.name,group:c.group,sub:c.sub,budget:num(c.budget)}:{name:'Other',group:'wants',sub:'Other',budget:0};
}
function plan(mk){
  const inc=planIncome(),save=sum(P.chambers,chTarget),debt=sum(P.debts.filter(d=>debtLeft(d)>0||!d.owed),d=>num(d.monthly));
  const needs=sum(P.cats.filter(c=>c.group==='needs'),c=>num(c.budget)),wants=sum(P.cats.filter(c=>c.group==='wants'),c=>num(c.budget));
  const proj=sum(P.projects.filter(p=>p.month===mk),p=>num(p.budget));
  const total=save+debt+needs+wants+proj;return{inc,save,debt,needs,wants,proj,total,left:inc-total};
}
function actual(mk){
  const L=txOf(mk),a={income:0,fees:0,lent:0,lentAvail:0,lentCh:{},repaid:0,repaidAvail:0,repaidCh:{},writtenOff:0,bySrc:{},spent:0,spentAvail:0,spentSav:0,saved:0,savedCh:{},savedSrc:{},withdrawn:0,usedCh:{},moved:0,byCat:{},count:{},items:L};
  const addSrc=(s,ch,x)=>{(a.savedSrc[s]=a.savedSrc[s]||{})[ch]=(a.savedSrc[s][ch]||0)+x};
  L.forEach(t=>{const v=t.type==='expense'?xTot(t):num(t.amt),f=feeOf(t);a.fees+=f;
    if(t.type==='income'){a.income+=v;a.bySrc[t.src]=(a.bySrc[t.src]||0)+v;for(const k in (t.saves||{})){const x=num(t.saves[k]);if(x>0){a.saved+=x;a.savedCh[k]=(a.savedCh[k]||0)+x;addSrc(t.src,k,x)}}}
    else if(t.type==='save'){a.saved+=v;a.savedCh[t.ch]=(a.savedCh[t.ch]||0)+v;addSrc('avail',t.ch,v)}
    else if(t.type==='expense'){a.spent+=v;const c=t.ch?Math.min(v,num(t.chAmt)):0;a.spentSav+=c;a.spentAvail+=v-c;if(c>0)a.usedCh[t.ch]=(a.usedCh[t.ch]||0)+c;const k=t.cat||'';a.byCat[k]=(a.byCat[k]||0)+v;a.count[k]=(a.count[k]||0)+1}
    else if(t.type==='lend'||t.type==='repay'){
      if(t.type==='lend'){a.lent+=v;if(t.ch)a.lentCh[t.ch]=(a.lentCh[t.ch]||0)+v;else a.lentAvail+=v}else{a.repaid+=v;if(t.ch)a.repaidCh[t.ch]=(a.repaidCh[t.ch]||0)+v;else a.repaidAvail+=v}
      if(f>0){a.spent+=f;if(t.ch){a.spentSav+=f;a.usedCh[t.ch]=(a.usedCh[t.ch]||0)+f}else a.spentAvail+=f;const k=t.feeCat||'';a.byCat[k]=(a.byCat[k]||0)+f;a.count[k]=(a.count[k]||0)+1}}
    else if(t.type==='writeoff'){a.spent+=v;a.writtenOff+=v;a.byCat['']=(a.byCat['']||0)+v;a.count['']=(a.count['']||0)+1}
    else if(t.type==='withdraw'||t.type==='transfer'){if(t.type==='withdraw'){a.withdrawn+=v;a.usedCh[t.ch]=(a.usedCh[t.ch]||0)+v}else a.moved+=v;
      if(f>0){a.spent+=f;a.spentSav+=f;a.usedCh[t.ch]=(a.usedCh[t.ch]||0)+f;const k=t.feeCat||'';a.byCat[k]=(a.byCat[k]||0)+f;a.count[k]=(a.count[k]||0)+1}}});
  a.used=a.withdrawn+a.spentSav;
  a.open=bal(monthEnd(addM(mk,-1)));a.close=bal(monthEnd(mk));a.left=a.close.avail;
  return a;
}
const spendOf=t=>t.type==='expense'?xTot(t):t.type==='writeoff'?num(t.amt):['withdraw','transfer','lend','repay'].includes(t.type)?feeOf(t):0;
const ytdSpent=mk=>{const y=mk.slice(0,4);return sum(Object.keys(TX).filter(k=>k.startsWith(y)&&k<=mk),k=>sum(TX[k],spendOf))};
const bName=id=>{const b=(P.borrowers||[]).find(x=>x.id===id);return b?b.name:'Someone'};
function lendInfo(id,upto){
  const L=allTx().filter(t=>t.who===id&&(!upto||t.date<=upto));
  const lent=sum(L.filter(t=>t.type==='lend'),t=>num(t.amt)),repaid=sum(L.filter(t=>t.type==='repay'),t=>num(t.amt)),written=sum(L.filter(t=>t.type==='writeoff'),t=>num(t.amt));
  const fees=sum(L.filter(t=>t.type==='lend'||t.type==='repay'),feeOf),dates=L.map(t=>t.date).sort();
  const dues=L.filter(t=>t.type==='lend'&&t.due).map(t=>t.due).sort();
  return{lent,repaid,written,fees,out:Math.max(0,lent-repaid-written),last:dates[dates.length-1]||'',first:dates[0]||'',due:dues[dues.length-1]||'',count:L.length};
}
const owedToMe=upto=>sum(P.borrowers||[],b=>lendInfo(b.id,upto).out);
function netWorth(upto){
  const b=bal(upto);const assets=sum(P.assets,a=>num(a.amount))+b.total+Math.max(0,b.avail)+owedToMe(upto),liab=sum(P.debts,debtLeft);return{assets,liab,nw:assets-liab};
}
/* suggested savings for a new income: same split as the last income from this source, else the plan's percentages */
function suggestSaves(src,amt){
  const out={};if(!(amt>0))return out;
  const prev=allTx().filter(t=>t.type==='income'&&t.src===src&&t.saves&&Object.values(t.saves).some(v=>num(v)>0)&&num(t.amt)>0).sort((x,y)=>y.date.localeCompare(x.date))[0];
  if(prev){for(const k in prev.saves){const r=num(prev.saves[k])/num(prev.amt);if(r>0&&P.chambers.some(c=>c.id===k))out[k]=Math.round(amt*r)}return out}
  const inc=planIncome();if(!inc)return out;
  P.chambers.forEach(c=>{const r=chTarget(c)/inc;if(r>0)out[c.id]=Math.round(amt*r)});return out;
}
const level=(spent,budget)=>{if(!budget)return spent>0?'bad':'good';const p=spent/budget*100;return p>=100?'bad':p>=num(P.settings.warnAt)?'warn':'good'};
const bar=(v,b,cls)=>`<div class="prog ${cls||level(v,b)}"><i style="width:${Math.min(100,b?Math.max(0,v)/b*100:(v>0?100:0)).toFixed(1)}%"></i></div>`;
const chColor=c=>`var(--c${c.color||1})`;
const chPill=id=>{const c=P.chambers.find(x=>x.id===id);return c?`<span class="pill" style="background:color-mix(in srgb,${chColor(c)} 18%,transparent);color:${chColor(c)}">${esc(c.name)}</span>`:'<span class="pill">Removed</span>'};
const sinkMonthly=s=>Math.max(0,num(s.amount)-num(s.saved))/monthsUntil(s.target);
const shopTotal=()=>sum(P.shop,r=>effPrice(r)*num(r.qty));
function syncShop(){if(!P.shopLink)return;const c=P.cats.find(x=>x.id===P.shopLink);if(c)c.budget=Math.round(shopTotal());else P.shopLink=null}

/* ---------- chart helpers ---------- */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function dailyChart(mk){
  const dim=daysIn(mk),days=Array(dim).fill(0);
  txOf(mk).forEach(t=>{const x=spendOf(t);if(x)days[+t.date.slice(8)-1]+=x});
  const p=plan(mk),pace=(p.needs+p.wants)/dim;
  const W=640,H=200,L=46,R=8,T=10,B=24,max=niceMax(Math.max(...days,pace)*1.08),bw=(W-L-R)/dim;
  const y=v=>T+(H-T-B)*(1-v/max);const td=mk===curMK()?+todayStr().slice(8):-1;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily spending for ${mLabel(mk)}">`;
  for(let i=0;i<=4;i++){const v=max*i/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="m">${fmtS(v)}</text>`}
  days.forEach((v,i)=>{const h=H-B-y(v);s+=`<rect x="${L+i*bw+1.5}" y="${y(v)}" width="${Math.max(1,bw-3)}" height="${Math.max(0,h)}" rx="2" fill="${i+1===td?'var(--gold)':'var(--accent)'}" opacity="${i+1>td&&td>0?0.25:1}"><title>${mLabel(mk,1)} ${i+1}: ${fmt(v)}</title></rect>`});
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(pace)}" y2="${y(pace)}" stroke="var(--bad)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
  [1,8,15,22,dim].forEach(d=>s+=`<text x="${L+(d-.5)*bw}" y="${H-6}" text-anchor="middle">${d}</text>`);
  return s+'</svg>';
}
function trendChart(mk){
  const ms=[...Array(6)].map((_,i)=>addM(mk,i-5)),data=ms.map(m=>{const a=actual(m);return{m,inc:a.income,sp:a.spent,sv:a.saved}});
  const W=640,H=210,L=46,R=8,T=10,B=24,max=niceMax(Math.max(1,...data.map(d=>Math.max(d.inc,d.sp+d.sv)))*1.05),gw=(W-L-R)/6,bw=Math.min(28,gw/3);
  const y=v=>T+(H-T-B)*(1-v/max);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Income versus spending and saving, last six months">`;
  for(let i=0;i<=4;i++){const v=max*i/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="m">${fmtS(v)}</text>`}
  data.forEach((d,i)=>{const cx=L+gw*i+gw/2;
    s+=`<rect x="${cx-bw-2}" y="${y(d.inc)}" width="${bw}" height="${H-B-y(d.inc)}" rx="3" fill="var(--accent)"><title>${mLabel(d.m)} income ${fmt(d.inc)}</title></rect>`;
    s+=`<rect x="${cx+2}" y="${y(d.sp)}" width="${bw}" height="${H-B-y(d.sp)}" rx="3" fill="var(--ink-2)"><title>Spent ${fmt(d.sp)}</title></rect>`;
    s+=`<rect x="${cx+2}" y="${y(d.sp+d.sv)}" width="${bw}" height="${y(d.sp)-y(d.sp+d.sv)}" fill="var(--gold)"><title>Saved ${fmt(d.sv)}</title></rect>`;
    s+=`<text x="${cx}" y="${H-6}" text-anchor="middle" style="${d.m===mk?'font-weight:700;fill:var(--ink)':''}">${mLabel(d.m,1)}</text>`});
  return s+'</svg>';
}

function sourceMatrix(a,cum){
  const data={};
  if(cum){allTx().forEach(t=>{if(t.type==='income')for(const k in (t.saves||{})){const x=num(t.saves[k]);if(x>0)(data[t.src]=data[t.src]||{})[k]=(data[t.src][k]||0)+x}else if(t.type==='save')(data.avail=data.avail||{})[t.ch]=(data.avail[t.ch]||0)+num(t.amt)})}
  else Object.assign(data,a.savedSrc);

  return `<div class="tw"><table><thead><tr><th>Saved from</th>${P.chambers.map(c=>`<th class="n">${esc(c.name)}</th>`).join('')}<th class="n">Total</th></tr></thead><tbody>
   ${srcs.map(s=>`<tr><td>${esc(srcName(s))}</td>${P.chambers.map(c=>`<td class="n">${data[s][c.id]?M(data[s][c.id]):'<span class="muted">–</span>'}</td>`).join('')}<td class="n"><b>${M(sum(Object.values(data[s])))}</b></td></tr>`).join('')}

}

function inp(coll,id,field,val,{type='number',cls='',ph=''}={}){
  const isNum=type==='number';return `<input id="f-${coll}-${id}-${field}" data-bind="${coll}|${id}|${field}" type="${isNum?'text':type}" ${isNum?'inputmode="decimal" autocomplete="off"':''} value="${esc(isNum?fmtIn(val):(val??''))}" class="${isNum?'m numin ':''}${cls}" placeholder="${isNum?(ph||'0'):ph}" aria-label="${esc(field)}">`}
/* item groups: needs or wants, each with a name (sub) */
const gKey=(type,sub)=>'g:'+type+':'+sub;
const gParse=k=>{const m=/^g:(needs|wants):([\s\S]*)$/.exec(k||'');return m?{type:m[1],sub:m[2]}:null};
const gLabel=(type,sub)=>type==='wants'&&sub==='Wants'?'Wants & giving':sub;
const isDefGroup=(type,sub)=>type==='needs'?SUBS.includes(sub):sub==='Wants';
function itemGroups(){
  const hid=P.hiddenSubs||[];const isHid=(type,sb)=>hid.includes(type+':'+sb)||(type==='needs'&&hid.includes(sb));
  const out=[];const add=(type,sb)=>{if(sb&&!out.some(x=>x.type===type&&x.sub===sb))out.push({type,sub:sb})};
  SUBS.forEach(sb=>{if(!isHid('needs',sb))add('needs',sb)});
  (P.extraSubs||[]).forEach(e=>{const m=/^(needs|wants):([\s\S]*)$/.exec(e);if(m)add(m[1],m[2]);else add('needs',e)});
  P.cats.filter(c=>c.group==='needs').forEach(c=>add('needs',c.sub));
  if(!isHid('wants','Wants'))add('wants','Wants');
  P.cats.filter(c=>c.group==='wants').forEach(c=>add('wants',c.sub));
  const ord=P.groupOrder||[],ix=x=>{const i=ord.indexOf(gKey(x.type,x.sub));return i<0?1e6:i};
  const sorted=out.map((x,i)=>[x,i]).sort((a,b)=>(ix(a[0])-ix(b[0]))||(a[1]-b[1])).map(a=>a[0]);
  return [...sorted.filter(x=>x.type==='needs'),...sorted.filter(x=>x.type==='wants')];
}
function keepOrder(oldKey,newKey){if(!P.groupOrder||!P.groupOrder.length)P.groupOrder=itemGroups().map(x=>gKey(x.type,x.sub));const i=P.groupOrder.indexOf(oldKey);if(i>=0)P.groupOrder[i]=newKey;else P.groupOrder.push(newKey)}
function setGroupVisible(type,sub,show){
  P.hiddenSubs=(P.hiddenSubs||[]).filter(x=>x!==type+':'+sub&&!(type==='needs'&&x===sub));
  P.extraSubs=(P.extraSubs||[]).filter(x=>x!==type+':'+sub&&!(type==='needs'&&x===sub));
  if(show){if(!isDefGroup(type,sub))P.extraSubs.push(type+':'+sub)}
  else if(isDefGroup(type,sub))P.hiddenSubs.push(type+':'+sub);
}

function planGroupAction(act,k){
  const snap=JSON.stringify(P);const mk=ui.month;
  const gp=gParse(k);const items=gp?P.cats.filter(c=>c.group===gp.type&&c.sub===gp.sub):k==='loans'?P.debts:k==='proj'?P.projects.filter(x=>x.month===mk):[];
  if(act==='clear'){
    if(k==='sav')P.chambers.forEach(c=>{c.mode='amt';c.amt=0;c.pct=0});
    else items.forEach(x=>{if(k==='loans')x.monthly=0;else if(!(k!=='proj'&&x.id===P.shopLink))x.budget=0});
    saveP();toastAction('Amounts cleared','Undo',()=>{P=migrate(JSON.parse(snap));saveP();render()});
  } else if(act==='delete'){
    const ids=new Set(items.map(x=>x.id));
    if(k==='loans')P.debts=P.debts.filter(x=>!ids.has(x.id));else if(k==='proj')P.projects=P.projects.filter(x=>!ids.has(x.id));
    else{if(ids.has(P.shopLink))P.shopLink=null;P.cats=P.cats.filter(x=>!ids.has(x.id));if(gp)setGroupVisible(gp.type,gp.sub,true)}
    saveP();toastAction(ids.size+' item'+(ids.size===1?'':'s')+' deleted','Undo',()=>{P=migrate(JSON.parse(snap));saveP();render()});
  }
  ui.confirm=null;render();
}
document.addEventListener('change',e=>{
  if(e.target.id!=='grpName')return;
  const gp=gParse(ui.planGroup);if(!gp)return;const old=gp.sub,label=gLabel(gp.type,old),nw=e.target.value.trim();
  if(!nw||nw===label||nw===old){e.target.value=label;return}
  if(itemGroups().some(x=>x.sub.toLowerCase()===nw.toLowerCase()&&!(x.type===gp.type&&x.sub===old))){toast('A group with that name already exists');e.target.value=label;return}
  keepOrder(gKey(gp.type,old),gKey(gp.type,nw));
  P.cats.forEach(c=>{if(c.group===gp.type&&c.sub===old)c.sub=nw});
  setGroupVisible(gp.type,old,false);setGroupVisible(gp.type,nw,true);
  ui.planGroup=gKey(gp.type,nw);lsSet('hz-pg',ui.planGroup);saveP();toast('Group renamed to “'+nw+'”');render();
});
function deleteGroup(k){
  const gp=gParse(k);if(!gp)return;const snap=JSON.stringify(P);const to=gParse(($('#gdelTo')||{value:''}).value);
  const items=P.cats.filter(c=>c.group===gp.type&&c.sub===gp.sub);
  if(to){items.forEach(c=>{c.group=to.type;c.sub=to.sub})}
  else{const ids=new Set(items.map(c=>c.id));if(ids.has(P.shopLink))P.shopLink=null;P.cats=P.cats.filter(c=>!ids.has(c.id))}
  setGroupVisible(gp.type,gp.sub,false);
  ui.planGroup=to?gKey(to.type,to.sub):'all';lsSet('hz-pg',ui.planGroup);ui.confirm=null;saveP();
  toastAction('Group “'+gLabel(gp.type,gp.sub)+'” deleted'+(to&&items.length?', items moved to '+gLabel(to.type,to.sub):''),'Undo',()=>{P=migrate(JSON.parse(snap));ui.planGroup=k;lsSet('hz-pg',k);saveP();render()});
  render();
}

function txRow(t){
  let v=num(t.amt);let title,meta,sign='−',ic,cls=t.type;
  if(t.type==='income'){const sv=Object.entries(t.saves||{}).filter(([k,x])=>num(x)>0);const s=sum(sv,([k,x])=>num(x));
    title=t.desc||srcName(t.src);sign='+';ic='IN';
    meta='Income · '+srcName(t.src)+(sv.length?' · saved '+sv.map(([k,x])=>fmt(num(x))+' to '+chName(k)).join(', ')+' · '+fmt(v-s)+' to Available':' · all to Available');}
  else if(t.type==='expense'){const ci=catInfo(t.cat);v=xTot(t);const c=t.ch?Math.min(v,num(t.chAmt)):0;title=t.desc||ci.name;ic='EX';
    meta=ci.name+(feeOf(t)?' · '+fmt(num(t.amt))+' + fee '+fmt(feeOf(t)):'')+' · paid from '+(c<=0?'Available':c>=v?chName(t.ch):'Available '+fmt(v-c)+' + '+chName(t.ch)+' '+fmt(c));if(c>0)cls='expense sav';}
  else if(t.type==='save'){title=t.desc||'Saved to '+chName(t.ch);meta='Saving · from Available to '+chName(t.ch);ic='SV'}
  else if(t.type==='withdraw'){title=t.desc||'Taken from '+chName(t.ch);meta='Moved from '+chName(t.ch)+' to Available'+(feeOf(t)?' · fee '+fmt(feeOf(t))+' (total out of '+chName(t.ch)+' '+fmt(v+feeOf(t))+')':'');sign='+';ic='MV'}
  else if(t.type==='lend'){title=t.desc||'Lent to '+bName(t.who);meta='Lent to '+bName(t.who)+' from '+(t.ch?chName(t.ch):'Available')+(feeOf(t)?' · fee '+fmt(feeOf(t)):'')+(t.due?' · due '+fmtD(t.due):'');ic='LN';cls='lend'}
  else if(t.type==='repay'){title=t.desc||'Repayment from '+bName(t.who);meta='Repaid by '+bName(t.who)+' into '+(t.ch?chName(t.ch):'Available')+(feeOf(t)?' · fee '+fmt(feeOf(t))+' (you received '+fmt(v-feeOf(t))+')':'');sign='+';ic='RP';cls='repay'}
  else if(t.type==='writeoff'){title=t.desc||'Written off: '+bName(t.who);meta='Loan to '+bName(t.who)+' written off · counted as spending';ic='WO';cls='expense sav'}
  else {title=t.desc||'Moved between accounts';meta=chName(t.ch)+' → '+chName(t.to)+(feeOf(t)?' · fee '+fmt(feeOf(t)):'');sign='';ic='MV';cls='transfer'}

function payoffMonths(d){const B=debtLeft(d),Pm=num(d.monthly),r=num(d.rate)/100/12;if(B<=0)return 0;if(Pm<=0)return Infinity;if(r===0)return Math.ceil(B/Pm);if(Pm<=B*r)return Infinity;return Math.ceil(-Math.log(1-r*B/Pm)/Math.log(1+r))}
function debtFinish(d){const n=payoffMonths(d);if(n===0)return 'done';if(n===Infinity)return null;const paidNow=debtPays(d).some(t=>t.date.slice(0,7)===curMK());return addM(curMK(),paidNow?n:n-1)}

/* ---------- type-to-search pickers (replace drop-down lists) ---------- */
const CB={};
const normT=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function combo(id,opts,sel,{ph='Type to search…',free=false,label=''}={}){
  CB[id]={opts,free};
  const cur=opts.find(o=>o.v===sel);
  const shown=cur?cur.l:(free?(sel||''):'');
  return `<div class="cb" data-cb="${id}"><input type="text" class="cb-in" id="${id}-q" value="${esc(shown)}" placeholder="${esc(ph)}" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="${id}-list" aria-autocomplete="list"${label?` aria-label="${esc(label)}"`:''}><input type="hidden" id="${id}" value="${esc(cur?cur.v:(free?(sel||''):''))}"><span class="cb-arrow" aria-hidden="true">▾</span><div class="cb-list" id="${id}-list" role="listbox" hidden></div></div>`;
}
function cbFilter(opts,q){
  const nq=normT(q);if(!nq)return opts.slice();
  const toks=nq.split(' ');
  const scored=[];
  opts.forEach(o=>{const L=normT(o.l),G=normT(o.g||'');const hay=L+' '+G;
    if(toks.every(t=>hay.includes(t))){let s=L.startsWith(nq)?0:toks.every(t=>(' '+L).includes(' '+t))?1:L.includes(toks[0])?2:3;scored.push([s,o])}});
  if(!scored.length){const letters=nq.replace(/ /g,'');opts.forEach(o=>{const L=normT(o.l).replace(/ /g,'');let i=0;for(const ch of L){if(ch===letters[i])i++;if(i===letters.length)break}if(i===letters.length)scored.push([4,o])})}
  return scored.sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
}
function cbOpen(wrap,showAll){
  const id=wrap.dataset.cb,cfg=CB[id];if(!cfg)return;
  const inpEl=wrap.querySelector('.cb-in'),list=wrap.querySelector('.cb-list');
  const res=cbFilter(cfg.opts,showAll?'':inpEl.value).slice(0,80);
  const cur=wrap.querySelector('input[type=hidden]').value;
  list.innerHTML=res.length?res.map((o,i)=>`<div class="cb-opt${i===0?' act':''}${o.v===cur?' sel':''}" role="option" data-i="${cfg.opts.indexOf(o)}"><span>${esc(o.l)}</span>${o.g?`<small>${esc(o.g)}</small>`:''}</div>`).join(''):`<div class="cb-none">${cfg.free?'Press Enter to search for “'+esc(inpEl.value)+'”':'No match. Try another word.'}</div>`;
  list.hidden=false;inpEl.setAttribute('aria-expanded','true');
}
function cbClose(wrap){const l=wrap.querySelector('.cb-list');if(l)l.hidden=true;const i=wrap.querySelector('.cb-in');if(i)i.setAttribute('aria-expanded','false')}
function cbPick(wrap,o){
  const h=wrap.querySelector('input[type=hidden]'),i=wrap.querySelector('.cb-in');
  h.value=o.v;i.value=o.l;cbClose(wrap);if(!wrap.closest('.modal'))i.blur();h.dispatchEvent(new Event('change',{bubbles:true}));
}
function cbCommitFree(wrap){const cfg=CB[wrap.dataset.cb];const h=wrap.querySelector('input[type=hidden]'),i=wrap.querySelector('.cb-in');if(h.value!==i.value){h.value=i.value;h.dispatchEvent(new Event('change',{bubbles:true}))}}
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('cb-in')){const w=e.target.closest('.cb');try{e.target.select()}catch(x){}cbOpen(w,true)}});
document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('cb-in'))cbOpen(e.target.closest('.cb'),false)});
document.addEventListener('mousedown',e=>{const o=e.target.closest('.cb-opt');if(!o)return;e.preventDefault();const w=o.closest('.cb');cbPick(w,CB[w.dataset.cb].opts[+o.dataset.i])});
document.addEventListener('keydown',e=>{
  if(!(e.target.classList&&e.target.classList.contains('cb-in')))return;
  const w=e.target.closest('.cb'),list=w.querySelector('.cb-list'),cfg=CB[w.dataset.cb];
  const items=[...list.querySelectorAll('.cb-opt')];let k=items.findIndex(x=>x.classList.contains('act'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(list.hidden){cbOpen(w,false);return}if(!items.length)return;items[k]&&items[k].classList.remove('act');k=e.key==='ArrowDown'?Math.min(items.length-1,k+1):Math.max(0,k-1);items[k].classList.add('act');items[k].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'){if(!list.hidden&&items[k]){e.preventDefault();cbPick(w,cfg.opts[+items[k].dataset.i])}else if(cfg.free){e.preventDefault();cbClose(w);cbCommitFree(w)}}
  else if(e.key==='Escape'&&!list.hidden){e.preventDefault();e.stopImmediatePropagation();cbClose(w)}
  else if(e.key==='Tab'&&!list.hidden&&items[k]&&e.target.value&&!cfg.free){cbPick(w,cfg.opts[+items[k].dataset.i])}
},true);
document.addEventListener('focusout',e=>{
  if(!(e.target.classList&&e.target.classList.contains('cb-in')))return;
  const w=e.target.closest('.cb');setTimeout(()=>{if(!w.isConnected||w.contains(document.activeElement))return;cbClose(w);const cfg=CB[w.dataset.cb];
    if(cfg.free){cbCommitFree(w);return}
    const h=w.querySelector('input[type=hidden]'),cur=cfg.opts.find(o=>o.v===h.value);e.target.value=cur?cur.l:''},120);
});

const chOptsList=(B,withAvail,withAll)=>[...(withAll?[{v:'',l:'All accounts'}]:[]),...(withAvail?[{v:'avail',l:'Available to spend',g:B?fmt(B.avail):''}]:[]),...P.chambers.map(c=>({v:c.id,l:c.name,g:B?'Savings · '+fmt(B.ch[c.id]||0):'Savings account'}))];

/* ---------- reports ---------- */
const JSPDF_URL='https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
const AUTOTABLE_URL='https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js';
const REP_TYPES=[['expense','Expenses'],['income','Income'],['savings','Savings'],['used','Used from savings'],['lent','Money lent'],['summary','Money summary']];
const dayBefore=d=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()-1);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())};
const fmtD=d=>new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
function repRange(){
  const r=ui.rep;
  if(r.preset==='month')return[ui.month+'-01',monthEnd(ui.month)];
  if(r.preset==='last'){const m=addM(ui.month,-1);return[m+'-01',monthEnd(m)]}
  if(r.preset==='year'){const y=ui.month.slice(0,4);return[y+'-01-01',y+'-12-31']}
  const f=r.from||ui.month+'-01',t=r.to||monthEnd(ui.month);return f<=t?[f,t]:[t,f];
}
function groupRows(list,keyF,amtF,total){
  const m={};list.forEach(x=>{const k=keyF(x);(m[k]=m[k]||{n:0,a:0}).n++;m[k].a+=amtF(x)});
  return Object.entries(m).sort((a,b)=>b[1].a-a[1].a).map(([k,v])=>[k,String(v.n),v.a,Math.round(pct(v.a,total))+'%']);
}
function buildReport(){
  const r=ui.rep,[from,to]=repRange(),L=allTx().filter(t=>t.date>=from&&t.date<=to).sort((a,b)=>a.date.localeCompare(b.date));
  const q=normT(r.item);const hit=(...txt)=>!q||q.split(' ').every(tok=>normT(txt.join(' ')).includes(tok));
  const out={title:'',from,to,filters:[],summary:[],groups:[],head:[],rows:[],num:[]};
  if(r.type==='expense'){
    let E=L.filter(t=>t.type==='expense').map(t=>({...t,_tot:xTot(t),_kind:'exp'}));
    L.forEach(t=>{if((t.type==='lend'||t.type==='repay')&&feeOf(t)>0)E.push({...t,cat:t.feeCat||'',amt:0,fee:feeOf(t),ch:t.ch,chAmt:t.ch?feeOf(t):0,_tot:feeOf(t),_kind:'fee',desc:'Fee: '+(t.type==='lend'?'lending to ':'repayment from ')+bName(t.who)+(t.desc?' · '+t.desc:'')});
      if(t.type==='writeoff')E.push({...t,cat:'',fee:0,ch:undefined,chAmt:0,_tot:num(t.amt),_kind:'wo',desc:'Loan written off: '+bName(t.who)})});
    L.forEach(t=>{if((t.type==='withdraw'||t.type==='transfer')&&feeOf(t)>0)E.push({...t,cat:t.feeCat||'',amt:0,fee:feeOf(t),ch:t.ch,chAmt:feeOf(t),_tot:feeOf(t),_kind:'fee',desc:'Fee: '+(t.type==='withdraw'?'move from '+chName(t.ch)+' to Available':chName(t.ch)+' to '+chName(t.to))+(t.desc?' · '+t.desc:'')})});
    E.sort((a,b)=>a.date.localeCompare(b.date));
    if(r.cat){E=E.filter(t=>r.cat==='__other'?!t.cat:t.cat===r.cat);out.filters.push('Category: '+(r.cat==='__other'?'Other':catInfo(r.cat).name))}
    if(r.ch){E=E.filter(t=>{const c=t.ch?Math.min(t._tot,num(t.chAmt)):0;return r.ch==='avail'?t._kind!=='wo'&&t._tot-c>0:t.ch===r.ch&&c>0});out.filters.push('Paid from: '+(r.ch==='avail'?'Available to spend':chName(r.ch)))}
    if(q){E=E.filter(t=>hit(t.desc,catInfo(t.cat).name));out.filters.push('Item: '+r.item)}
    const tot=sum(E,t=>t._tot),fromSav=sum(E,t=>t.ch?Math.min(t._tot,num(t.chAmt)):0),fees=sum(E,t=>feeOf(t));
    out.title='Expense report';
    const woT=sum(E.filter(t=>t._kind==='wo'),t=>t._tot);
    out.summary=[['Total spent (including fees)',tot],['Of which transaction fees',fees],['Paid from Available to spend',tot-fromSav-woT],['Paid from savings accounts',fromSav],...(woT?[['Loans written off (no money moved)',woT]]:[]),['Number of entries',String(E.length)]];
    out.groups=[{title:'By category',head:['Category','Entries','Amount','Share'],rows:groupRows(E,t=>catInfo(t.cat).name,t=>t._tot,tot)},
      {title:'By group',head:['Group','Entries','Amount','Share'],rows:groupRows(E,t=>{const c=catInfo(t.cat);return c.group==='wants'?'Wants':c.sub},t=>t._tot,tot)}];
    out.head=['Date','Category','Item / description','Paid from','Amount','Fee','Total'];
    out.rows=E.map(t=>{const v=t._tot,c=t.ch?Math.min(v,num(t.chAmt)):0;return[fmtD(t.date),catInfo(t.cat).name,t.desc||'',t._kind==='wo'?'Written off':c<=0?'Available':c>=v?chName(t.ch):'Available '+fmt(v-c)+' + '+chName(t.ch)+' '+fmt(c),num(t.amt),feeOf(t),v]});
  } else if(r.type==='income'){
    let I=L.filter(t=>t.type==='income');
    if(r.src){I=I.filter(t=>t.src===r.src);out.filters.push('Source: '+srcName(r.src))}
    if(q){I=I.filter(t=>hit(t.desc,srcName(t.src)));out.filters.push('Item: '+r.item)}
    const tot=sum(I,t=>num(t.amt)),sv=sum(I,t=>sum(Object.values(t.saves||{}),num));
    out.title='Income report';
    out.summary=[['Total income',tot],['Saved straight from income',sv],['Went to Available to spend',tot-sv],['Number of entries',String(I.length)]];
    out.groups=[{title:'By source',head:['Source','Entries','Amount','Share'],rows:groupRows(I,t=>srcName(t.src),t=>num(t.amt),tot)}];
    out.head=['Date','Source','Description','Saved','To Available','Amount'];
    out.rows=I.map(t=>{const s=sum(Object.values(t.saves||{}),num);return[fmtD(t.date),srcName(t.src),t.desc||'',s,num(t.amt)-s,num(t.amt)]});
  } else if(r.type==='savings'){
    let S=[];L.forEach(t=>{if(t.type==='income')for(const k in (t.saves||{})){const x=num(t.saves[k]);if(x>0)S.push({date:t.date,ch:k,src:t.src,desc:t.desc||'',amt:x})}else if(t.type==='save')S.push({date:t.date,ch:t.ch,src:'avail',desc:t.desc||'',amt:num(t.amt)})});
    if(r.ch&&r.ch!=='avail'){S=S.filter(x=>x.ch===r.ch);out.filters.push('Account: '+chName(r.ch))}
    if(r.src){S=S.filter(x=>x.src===r.src);out.filters.push('Saved from: '+srcName(r.src))}
    if(q){S=S.filter(x=>hit(x.desc,srcName(x.src),chName(x.ch)));out.filters.push('Item: '+r.item)}
    const tot=sum(S,x=>x.amt),b=bal(to);
    out.title='Savings report';
    out.summary=[['Total saved in period',tot],...P.chambers.filter(c=>!r.ch||r.ch==='avail'||c.id===r.ch).map(c=>['Balance of '+c.name+' on '+fmtD(to),b.ch[c.id]||0]),['Total savings on '+fmtD(to),b.total]];
    out.groups=[{title:'By account',head:['Account','Entries','Amount','Share'],rows:groupRows(S,x=>chName(x.ch),x=>x.amt,tot)},{title:'By source',head:['Saved from','Entries','Amount','Share'],rows:groupRows(S,x=>srcName(x.src),x=>x.amt,tot)}];
    out.head=['Date','Account','Saved from','Description','Amount'];
    out.rows=S.map(x=>[fmtD(x.date),chName(x.ch),srcName(x.src),x.desc,x.amt]);
  } else if(r.type==='lent'){
    let X=L.filter(t=>['lend','repay','writeoff'].includes(t.type));
    if(q){X=X.filter(t=>hit(bName(t.who),t.desc));out.filters.push('Person or item: '+r.item)}
    const lent=sum(X.filter(t=>t.type==='lend'),t=>num(t.amt)),rep_=sum(X.filter(t=>t.type==='repay'),t=>num(t.amt)),wo=sum(X.filter(t=>t.type==='writeoff'),t=>num(t.amt)),fees=sum(X,feeOf);
    out.title='Money lent report';
    out.summary=[['Lent in period',lent],['Repaid in period',rep_],['Written off in period',wo],['Your transaction fees',fees],['Still owed to you (on '+fmtD(to)+')',owedToMe(to)]];
    const people=[...new Set(X.map(t=>t.who))];

function download(filename,data){

    else if(type==='expense'){rec.type='expense';const cv=$('#lgCat').value;if(!cv){toast('Choose a category: start typing, then pick from the list');$('#lgCat-q').focus();return}rec.cat=cv==='__other'?'':cv;const from=$('#lgFrom').value;
      if(from!=='avail'){rec.ch=from;rec.chAmt=tot;if(tot>(B.ch[from]||0)+0.5){toast(chName(from)+' only has '+fmt(B.ch[from]||0));return}}
      else if(tot>Math.max(0,B.avail)){const ch=$('#lgShortCh').value,short=tot-Math.max(0,B.avail);if(short>(B.ch[ch]||0)+0.5){toast(chName(ch)+' only has '+fmt(B.ch[ch]||0)+'. Pick another account.');return}rec.ch=ch;rec.chAmt=short}}
    else if(type==='lend'){
      let who=$('#lgWho').value.trim();const acc=$('#lgAcc').value||'avail';
      if(!who){toast(lendMode==='lend'?'Type who you lent to':'Choose who repaid you');$('#lgWho-q').focus();return}
      let b=(P.borrowers||[]).find(x=>x.id===who)||(P.borrowers||[]).find(x=>x.name.toLowerCase()===who.toLowerCase());
      if(lendMode==='repay'){if(!b){toast('Pick a person from the list. Nothing is recorded as lent to “'+who+'”.');return}
        const i=lendInfo(b.id),back=orig&&orig.who===b.id&&orig.type==='repay'?num(orig.amt):orig&&orig.who===b.id&&orig.type==='lend'?-num(orig.amt):0;if(amt>i.out+back+0.5){toast(b.name+' only owes you '+fmt(Math.max(0,i.out+back)));return}
        if(fee>=amt){toast('The fee can’t be bigger than the repayment');return}
        rec.type='repay'}
      else{const bal_=acc==='avail'?B.avail:(B.ch[acc]||0);if(tot>bal_+0.5){toast((acc==='avail'?'Available to spend':chName(acc))+' only has '+fmt(Math.max(0,bal_))+(fee?' (amount + fee is '+fmt(tot)+')':''));return}
        if(!b){b={id:nid(),name:who,note:''};P.borrowers=P.borrowers||[];P.borrowers.push(b);saveP()}
        rec.type='lend';const du=$('#lgDue').value;if(du)rec.due=du}
      rec.who=b.id;if(acc!=='avail')rec.ch=acc;if(fee>0)rec.feeCat=feeCatId()}
    else if(type==='save'){rec.type='save';rec.ch=$('#lgCh').value;if(!rec.ch){toast('Choose an account');return}}
    else {const from=$('#lgCh').value,to=$('#lgTo').value;if(from===to){toast('Pick two different accounts');return}
      if(tot>(B.ch[from]||0)+0.5){toast(chName(from)+' only has '+fmt(B.ch[from]||0)+(fee?' (amount + fee is '+fmt(tot)+')':''));return}
      rec.ch=from;if(fee>0)rec.feeCat=feeCatId();if(to==='avail')rec.type='withdraw';else{rec.type='transfer';rec.to=to}}
    if(!P.settings.started){P.settings.started=date;saveP()}
    if(editing){TX[editing]=TX[editing].filter(x=>x.id!==t.id);saveTx(editing)}
    const mk=date.slice(0,7);(TX[mk]=TX[mk]||[]).push(rec);saveTx(mk);_bal={};
    const label={income:'income',expense:'expense',save:'saving',withdraw:'move to Available',transfer:'move between accounts',lend:'lent to '+bName(rec.who),repay:'repayment from '+bName(rec.who)}[rec.type];
    toast((editing?'Updated: ':'Saved: ')+label+' of '+fmt(amt)+(fee?' + fee '+fmt(fee):'')+(rec.type==='expense'&&rec.ch?' ('+fmt(rec.chAmt)+' from '+chName(rec.ch)+')':''));
    if(again){close();render();openLog({t:{type:rec.type==='withdraw'||rec.type==='transfer'?'move':rec.type,date,cat:rec.cat,src:rec.src,ch:rec.ch,saves:{}}})}else{close();render()}
  };
  draw();
}

function toastAction(msg,label,fn){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.innerHTML='';const s=document.createElement('span');s.textContent=msg;const b=document.createElement('button');b.className='toastbtn';b.textContent=label;b.onclick=()=>{el.remove();fn()};el.append(s,b);clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),7000)}
let toastT;function toast(msg){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2600)}

/* tell the user when GitHub has a newer index.html than the one on screen */
async function checkUpdate(){
  try{const r=await fetch('./index.html?check='+Date.now(),{cache:'no-store'});if(!r.ok)return;const txt=await r.text();
    const m=/const APP_BUILD='([^']*)'/.exec(txt);if(!m||m[1]===APP_BUILD||$('#updbar'))return;
    const b=document.createElement('div');b.id='updbar';b.className='updbar';b.innerHTML='<span><b>A new version of Hazina is ready.</b></span><button class="btn sm" id="updGo">Update now</button>';document.body.appendChild(b);
    $('#updGo').onclick=async()=>{try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(x=>x.update().catch(()=>{})))}catch(e){}location.replace(location.pathname+'?v='+Date.now()+location.hash)};
  }catch(e){}
}
setTimeout(checkUpdate,4000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
})();
