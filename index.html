    } else if(type==='lend'){
      const people=(P.borrowers||[]).map(b=>({v:b.id,l:b.name,g:lendInfo(b.id).out?'owes '+fmt(lendInfo(b.id).out):'settled'}));
      body=`<div class="seg seg2" role="group" aria-label="Lending"><button type="button" data-lm="lend" aria-pressed="${lendMode==='lend'}">I lent money</button><button type="button" data-lm="repay" aria-pressed="${lendMode==='repay'}">Repayment received</button></div>
      <div class="fgrid"><div class="field"><label for="lgWho-q">${lendMode==='lend'?'Lent to':'Repaid by'}</label>${combo('lgWho',people,t.who||'',{ph:lendMode==='lend'?'Type a name, new or existing':'Type the person’s name',free:lendMode==='lend'})}</div><div class="field"><label for="lgDate">Date</label><input id="lgDate" type="date" required value="${t.date}"></div></div>
      <div class="tip" id="lgOwes" hidden></div>
      <div class="fgrid"><div class="field"><label for="lgAcc-q">${lendMode==='lend'?'Paid from':'Received into'}</label>${combo('lgAcc',chOptsList(B,true),t.ch||'avail',{ph:'Type Available or an account'})}</div>
      ${lendMode==='lend'?`<div class="field"><label for="lgDue">Expected back by (optional)</label><input id="lgDue" type="date" value="${esc(t.due||'')}"></div>`:''}</div>
      <div class="feebox"><div class="field"><label for="lgFee">Transaction fee (optional)</label><input id="lgFee" class="numin" type="text" inputmode="decimal" autocomplete="off" value="${fmtIn(t.fee)}" placeholder="0"></div><div class="kv feetot"><span>Total</span><b id="lgTot">–</b></div></div>
      <p class="note" style="margin:0">${lendMode==='lend'?'Lending is not spending: it is money owed back to you. Only the fee counts as spending.':'A repayment is not new income: it is your money coming back. A fee (for example moving it into a savings account) is taken from the amount and counted as spending.'}</p>`;
    } else if(type==='save'){
      const sv0=t.saves&&Object.keys(t.saves).length?t.saves:(t.ch&&t.amt?{[t.ch]:t.amt}:{});const rem=remainingTargets(t.date,orig&&orig.id);
      body=`${t.fromIncome?`<div class="tip">Income of <b>${fmt(t.fromIncome)}</b> saved. Available to spend is now <b>${fmt(B.avail)}</b>. Suggested savings are filled in below; change any amount or clear them.</div>`:''}<div class="fgrid"><div class="field"><label for="lgSrc-q">Saved from</label>${combo('lgSrc',[{v:'avail',l:'Available to spend (general)',g:fmt(B.avail)},...srcOpts()],t.src||'avail',{ph:'Type an income source'})}</div><div class="field"><label for="lgDate">Date</label><input id="lgDate" type="date" required value="${t.date}"></div></div>
      <div class="savebox"><div class="card-h" style="margin:0 0 6px"><b>Amounts to save</b><div class="inline-actions"><button type="button" class="addrow" style="margin:0" id="lgSuggest">Use suggestion</button><button type="button" class="addrow" style="margin:0" id="lgClearS">Clear</button></div></div>
        ${P.chambers.map(c=>`<div class="saverow"><label for="lgS-${c.id}">${chPill(c.id)} <small class="muted">balance ${fmt(B.ch[c.id]||0)}</small><small class="muted" style="display:block;margin-top:3px">${rem[c.id]?'Suggested '+fmt(rem[c.id])+' (left of this month’s target)':'This month’s target reached'}</small></label><input id="lgS-${c.id}" class="lgS numin" data-ch="${c.id}" type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="${fmtIn(sv0[c.id])}"></div>`).join('')}
        <div class="kv" style="margin-top:6px"><span>Total to save</span><b id="lgSaveTot">–</b></div>
        <div class="kv"><span>Available to spend after this</span><b id="lgRest">–</b></div></div>
      <p class="note" style="margin:0">Type your own amounts, or tap <b>Use suggestion</b> to fill in what is left of each account’s monthly target. You can change any figure before saving.</p>`;
    } else {
      body=`<div class="fgrid"><div class="field"><label for="lgCh-q">From account</label>${chPick('lgCh',t.ch)}</div><div class="field"><label for="lgTo-q">To</label>${combo('lgTo',chOptsList(null,true),t.type==='transfer'&&t.to?t.to:'avail',{ph:'Type Available or an account'})}</div></div>
      <div class="field"><label for="lgDate">Date</label><input id="lgDate" type="date" required value="${t.date}"></div>
      <div class="feebox"><div class="field"><label for="lgFee">Transaction fee (optional)</label><input id="lgFee" class="numin" type="text" inputmode="decimal" autocomplete="off" value="${fmtIn(t.fee)}" placeholder="0"></div><div class="kv feetot"><span>Total</span><b id="lgTot">–</b></div></div>
      <p class="note" style="margin:0">Use this to take savings out to spend, or to move money between savings accounts. A fee is taken from the “From” account and counted as spending${feeCatId()?' under '+esc(catInfo(feeCatId()).name):''}.</p>`;
    }
    $('#modalRoot').innerHTML=`<div class="scrim" id="scrim"><form class="modal" id="logForm" role="dialog" aria-modal="true" aria-labelledby="lgTitle" novalidate>
      <div class="card-h" style="margin:0"><h2 id="lgTitle">${editing?'Edit transaction':'Log a transaction'}</h2><button type="button" class="x" id="lgClose" aria-label="Close">×</button></div>
      <div class="seg segtype" role="group" aria-label="Type">${[['income','Income'],['expense','Expense'],['save','Save'],['move','Move'],['lend','Lend']].map(([k,l])=>`<button type="button" data-type="${k}" aria-pressed="${type===k}">${l}</button>`).join('')}</div>
      ${type==='save'?'<input type="hidden" id="lgAmt" value="">':`<div class="field amt-in"><label for="lgAmt">Amount (Ksh)</label><input id="lgAmt" class="numin" type="text" inputmode="decimal" autocomplete="off" required value="${fmtIn(t.amt)}" placeholder="0"></div>`}
      ${body}
      <div class="field"><label for="lgDesc">Description</label><input id="lgDesc" type="text" value="${esc(t.desc||'')}" placeholder="${type==='expense'?'e.g. Naivas – vegetables':type==='income'?'e.g. November salary':'Optional note'}" maxlength="120"></div>
      <div class="inline-actions"><button class="btn" type="submit" style="flex:1">${editing?'Save changes':'Save'}</button>${!editing&&type==='income'?'<button class="btn ghost" type="button" id="lgIncSave">Save &amp; allocate savings</button>':''}${editing?'':'<button class="btn ghost" type="button" id="lgAgain">Save &amp; add another</button>'}</div>
    </form></div>`;
    $('#lgAmt').focus();
    $('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')close()});
    $('#lgClose').onclick=close;
    document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{grab();type=b.dataset.type;draw()});
    $('#logForm').onsubmit=e=>{e.preventDefault();save(false)};
    const ag=$('#lgAgain');if(ag)ag.onclick=()=>save(true);
    const isv=$('#lgIncSave');if(isv)isv.onclick=()=>save(false,true);
    $('#lgAmt').addEventListener('input',live);
    document.querySelectorAll('.lgS').forEach(i=>i.addEventListener('input',live));
    if(type==='save'){
      const fill=()=>{const r=remainingTargets($('#lgDate').value,orig&&orig.id);let tot=sum(Object.values(r));const cap=Math.max(0,B.avail);const k=tot>cap&&tot>0?cap/tot:1;
        document.querySelectorAll('.lgS').forEach(i=>{i.value=fmtIn(Math.floor((r[i.dataset.ch]||0)*k))});live();if(k<1)toast('Suggestion reduced to fit the '+fmt(cap)+' available to spend')};
      $('#lgSuggest').onclick=fill;$('#lgClearS').onclick=()=>{document.querySelectorAll('.lgS').forEach(i=>{i.value=''});live()};
      if(t.auto&&!editing){t.auto=false;fill()}
    }
    if(type==='expense'){$('#lgFrom').onchange=live;$('#lgCat').onchange=live}
    if(type==='lend'){document.querySelectorAll('[data-lm]').forEach(b=>b.onclick=()=>{grab();lendMode=b.dataset.lm;draw()});$('#lgWho').onchange=live;$('#lgAcc').onchange=live}
    const fe=$('#lgFee');if(fe)fe.addEventListener('input',live);
    live();
  };
  const live=()=>{
    const amt0=num($('#lgAmt').value),fee=$('#lgFee')?num($('#lgFee').value):0;const amt=type==='expense'?amt0+fee:amt0;
    const tt=$('#lgTot');if(tt)tt.textContent=fee?(type==='expense'?fmt(amt0)+' + '+fmt(fee)+' = '+fmt(amt0+fee):type==='lend'&&lendMode==='repay'?'You receive '+fmt(amt0-fee):fmt(amt0+fee)+' out of the account'):fmt(amt0);
    if(type==='lend'){const ow=$('#lgOwes'),w=$('#lgWho').value,b=(P.borrowers||[]).find(x=>x.id===w);if(b){const i=lendInfo(b.id);const back=orig&&orig.who===b.id?(orig.type==='repay'?num(orig.amt):orig.type==='lend'?-num(orig.amt):0):0;const o2=Math.max(0,i.out+back);ow.innerHTML=lendMode==='repay'?`<b>${esc(b.name)} owes you ${fmt(o2)}.</b> After this: ${fmt(Math.max(0,o2-amt0))}`:`${esc(b.name)} already owes you ${fmt(o2)}. After this: <b>${fmt(o2+amt0)}</b>`;ow.hidden=false}else ow.hidden=true}
    if(type==='income'&&$('#lgIncAv')){$('#lgIncAv').textContent=fmt(B.avail)+' now → '+fmt(B.avail+amt)+' after this income'}
    if(type==='income'&&$('#lgRest')){const s=sum([...document.querySelectorAll('.lgS')],i=>num(i.value));const r=$('#lgRest');r.textContent=fmt(amt-s);r.className=amt-s<0?'neg':''}
    if(type==='save'){const s=sum([...document.querySelectorAll('.lgS')],i=>num(i.value));$('#lgAmt').value=s;$('#lgSaveTot').textContent=fmt(s);const r=$('#lgRest'),left=B.avail-s;r.textContent=fmt(left);r.className=left<0?'neg':''}
    if(type==='expense'){const box=$('#lgShort'),from=$('#lgFrom').value;
      if(from==='avail'&&amt>Math.max(0,B.avail)){const short=amt-Math.max(0,B.avail);const best=P.chambers.slice().sort((x,y)=>(B.ch[y.id]||0)-(B.ch[x.id]||0))[0];
        const had=$('#lgShortCh');const prev=had?had.value:(t.ch||(best&&best.id));
        if(had){box.querySelector('b').textContent='Only '+fmt(Math.max(0,B.avail))+' is available to spend.';box.querySelector('label').textContent='Pay the other '+fmt(short)+' from'}
        else box.innerHTML=`<b>Only ${fmt(Math.max(0,B.avail))} is available to spend.</b><div class="field" style="margin-top:8px"><label for="lgShortCh-q">Pay the other ${fmt(short)} from</label>${chPick('lgShortCh',prev,'Account that pays the rest')}</div>`;box.hidden=false}
      else {box.hidden=true;box.innerHTML=''}
      {const sh=$('#lgShop'),cv=$('#lgCat').value,stt=Math.round(shopTotal());if(sh){if(cv&&cv===shopCatId()&&stt){const spent=sum(txOf(($('#lgDate').value||todayStr()).slice(0,7)).filter(x=>x.type==='expense'&&x.cat===cv&&(!orig||x.id!==orig.id)),xTot);sh.innerHTML=`Shopping list total: <b>${fmt(stt)}</b> · spent on this so far this month: ${fmt(spent)} <button type="button" class="addrow" style="margin:0 0 0 6px" id="lgUseShop">Use ${fmt(Math.max(0,stt-spent)||stt)}</button>`;sh.hidden=false;$('#lgUseShop').onclick=()=>{$('#lgAmt').value=fmtIn(Math.max(0,stt-spent)||stt);live()}}else sh.hidden=true}}
      const lc=$('#lgCat').value,lb=$('#lgLoan');if(lc&&lc.startsWith('debt:')){const d=P.debts.find(x=>'debt:'+x.id===lc);if(d){const before=Math.max(0,num(d.owed)-debtPaid(d)+(orig&&orig.cat===lc?num(orig.amt):0));lb.innerHTML=`<b>Counts as an instalment for ${esc(d.name)}.</b> Owed before this: ${fmt(before)} · after: ${fmt(Math.max(0,before-amt0))}${fee?' (the fee doesn’t reduce the loan)':''}`;lb.hidden=false}}else{lb.hidden=true}}
  };
  const grab=()=>{t.amt=$('#lgAmt').value;t.date=$('#lgDate').value;t.desc=$('#lgDesc').value;
    const c=$('#lgCat');if(c)t.cat=c.value==='__other'?'':c.value;const s=$('#lgSrc');if(s)t.src=s.value;const ch=$('#lgCh');if(ch)t.ch=ch.value;const fe=$('#lgFee');if(fe)t.fee=num(fe.value);const wh=$('#lgWho');if(wh)t.who=wh.value;const ac=$('#lgAcc');if(ac)t.ch=ac.value==='avail'?'':ac.value;const du=$('#lgDue');if(du)t.due=du.value;
    document.querySelectorAll('.lgS').forEach(i=>{t.saves[i.dataset.ch]=num(i.value)})};
  const close=()=>{$('#modalRoot').innerHTML='';document.removeEventListener('keydown',esc_)};
  const esc_=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',esc_);
  const save=(again,thenSave)=>{
    const amt=type==='save'?sum([...document.querySelectorAll('.lgS')],i=>num(i.value)):num($('#lgAmt').value),date=$('#lgDate').value;
    if(!(amt>0)){toast(type==='save'?'Type an amount for at least one account':'Enter an amount above zero');(type==='save'?$('.lgS'):$('#lgAmt')).focus();return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast('Pick a date');return}
    const rec={id:editing?t.id:nid(),date,amt,desc:$('#lgDesc').value.trim(),ts:orig&&orig.ts?orig.ts:Date.now()};
    const fee=(type==='expense'||type==='move'||type==='lend')&&$('#lgFee')?num($('#lgFee').value):0;if(fee>0)rec.fee=fee;const tot=amt+fee;
    if(type==='income'){rec.type='income';rec.src=$('#lgSrc').value;if(!rec.src){toast('Choose an income source');return}rec.saves={};let s=0;
      document.querySelectorAll('.lgS').forEach(i=>{const v=num(i.value);if(v>0){rec.saves[i.dataset.ch]=v;s+=v}});
      if(s>amt){toast('You can’t save more than the income itself');return}}
    else if(type==='expense'){rec.type='expense';const cv=$('#lgCat').value;if(!cv){toast('Choose a category: start typing, then pick from the list');$('#lgCat-q').focus();return}rec.cat=cv==='__other'?'':cv;const from=$('#lgFrom').value;
      if(from!=='avail'){rec.ch=from;rec.chAmt=tot;if(tot>(B.ch[from]||0)+0.5){toast(chName(from)+' only has '+fmt(B.ch[from]||0));return}}
      else if(tot>Math.max(0,B.avail)){const ch=$('#lgShortCh').value,short=tot-Math.max(0,B.avail);if(short>(B.ch[ch]||0)+0.5){toast(chName(ch)+' only has '+fmt(B.ch[ch]||0)+'. Pick another account.');return}rec.ch=ch;rec.chAmt=short}}
    else if(type==='lend'){
      let who=$('#lgWho').value.trim();const acc=$('#lgAcc').value||'avail';
      if(!who){toast(lendMode==='lend'?'Type who you lent to':'Choose who repaid you');$('#lgWho-q').focus();return}
      let b=(P.borrowers||[]).find(x=>x.id===who)||(P.borrowers||[]).find(x=>x.name.toLowerCase()===who.toLowerCase());
      if(lendMode==='repay'){if(!b){toast('Pick a person from the list. Nothing is recorded as lent to “'+who+'”.');return}
        const i=lendInfo(b.id),back=orig&&orig.who===b.id&&orig.type==='repay'?num(orig.amt):orig&&orig.who===b.id&&orig.type==='lend'?-num(orig.amt):0;if(amt>i.out+back+0.5){toast(b.name+' only owes you '+fmt(Math.max(0,i.out+back)));return}
        if(fee>=amt){toast('The fee can’t be bigger than the repayment');return}
        rec.type='repay'}
      else{const bal_=acc==='avail'?B.avail:(B.ch[acc]||0);if(tot>bal_+0.5){toast((acc==='avail'?'Available to spend':chName(acc))+' only has '+fmt(Math.max(0,bal_))+(fee?' (amount + fee is '+fmt(tot)+')':''));return}
        if(!b){b={id:nid(),name:who,note:''};P.borrowers=P.borrowers||[];P.borrowers.push(b);saveP()}
        rec.type='lend';const du=$('#lgDue').value;if(du)rec.due=du}
      rec.who=b.id;if(acc!=='avail')rec.ch=acc;if(fee>0)rec.feeCat=feeCatId()}
    else if(type==='save'){rec.type='save';rec.src=$('#lgSrc').value||'avail';rec.saves={};document.querySelectorAll('.lgS').forEach(i=>{const v=num(i.value);if(v>0)rec.saves[i.dataset.ch]=v});
      if(amt>Math.max(0,B.avail)+0.5){toast('Only '+fmt(Math.max(0,B.avail))+' is available to spend. Lower the amounts.');return}}
    else {const from=$('#lgCh').value,to=$('#lgTo').value;if(from===to){toast('Pick two different accounts');return}
      if(tot>(B.ch[from]||0)+0.5){toast(chName(from)+' only has '+fmt(B.ch[from]||0)+(fee?' (amount + fee is '+fmt(tot)+')':''));return}
      rec.ch=from;if(fee>0)rec.feeCat=feeCatId();if(to==='avail')rec.type='withdraw';else{rec.type='transfer';rec.to=to}}
    if(!P.settings.started){P.settings.started=date;saveP()}
    if(editing){TX[editing]=TX[editing].filter(x=>x.id!==t.id);saveTx(editing)}
    const mk=date.slice(0,7);(TX[mk]=TX[mk]||[]).push(rec);saveTx(mk);_bal={};
    const label={income:'income',expense:'expense',save:'saving to '+Object.keys(rec.saves||{}).length+' account'+(Object.keys(rec.saves||{}).length===1?'':'s'),withdraw:'move to Available',transfer:'move between accounts',lend:'lent to '+bName(rec.who),repay:'repayment from '+bName(rec.who)}[rec.type];
    if(rec.type==='income'&&!editing&&thenSave){close();render();openLog({t:{type:'save',src:rec.src,date,saves:{},auto:true,fromIncome:amt}});return}
    if(rec.type==='income'&&!editing)toastAction('Saved income of '+fmt(amt),'Save some now',()=>openLog({t:{type:'save',src:rec.src,date,saves:{},auto:true,fromIncome:amt}}));
    else toast((editing?'Updated: ':'Saved: ')+label+' of '+fmt(amt)+(fee?' + fee '+fmt(fee):'')+(rec.type==='expense'&&rec.ch?' ('+fmt(rec.chAmt)+' from '+chName(rec.ch)+')':''));
    if(again){close();render();openLog({t:{type:rec.type==='withdraw'||rec.type==='transfer'?'move':rec.type,date,cat:rec.cat,src:rec.src,ch:rec.ch,saves:{}}})}else{close();render()}
  };
  draw();
}

function toastAction(msg,label,fn){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.innerHTML='';const s=document.createElement('span');s.textContent=msg;const b=document.createElement('button');b.className='toastbtn';b.textContent=label;b.onclick=()=>{el.remove();fn()};el.append(s,b);clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),7000)}
let toastT;function toast(msg){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2600)}

/* ---------- chrome ---------- */
$('#mPrev').onclick=()=>{ui.month=addM(ui.month,-1);render()};
$('#mNext').onclick=()=>{ui.month=addM(ui.month,1);render()};
$('#privBtn').onclick=()=>{ui.priv=!ui.priv;lsSet('hz-priv',ui.priv?'1':'0');render()};
$('#fab').onclick=()=>{if(store.viewing){toast('Read-only: you are viewing another account');return}if(ui.view==='pcr'){openPcr(null,{k:'ap',s:'paid'});return}openLog()};
window.addEventListener('hashchange',route);
document.body.classList.toggle('private',ui.priv);
$('#app').innerHTML='<div class="empty">Loading your finances…</div>';
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#installBtn').hidden=false});
$('#installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;$('#installBtn').hidden=true};
window.addEventListener('appinstalled',()=>{$('#installBtn').hidden=true;toast('Hazina installed')});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js?v='+APP_VERSION).catch(()=>{});
boot();
/* tell the user when GitHub has a newer index.html than the one on screen */
async function checkUpdate(){
  try{const r=await fetch('./index.html?check='+Date.now(),{cache:'no-store'});if(!r.ok)return;const txt=await r.text();
    const m=/const APP_BUILD='([^']*)'/.exec(txt);if(!m||m[1]===APP_BUILD||$('#updbar'))return;
    const b=document.createElement('div');b.id='updbar';b.className='updbar';b.innerHTML='<span><b>A new version of Hazina is ready.</b></span><button class="btn sm" id="updGo">Update now</button>';document.body.appendChild(b);
    $('#updGo').onclick=async()=>{try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(x=>x.update().catch(()=>{})))}catch(e){}location.replace(location.pathname+'?v='+Date.now()+location.hash)};
  }catch(e){}
}
setTimeout(checkUpdate,4000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
})();
